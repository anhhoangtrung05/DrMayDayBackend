server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: drmayday-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:drmayday}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-please-use-env-var}
  access-token-expiration-ms: ${JWT_ACCESS_EXP:3600000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXP:604800000}

logging:
  level:
    com.drmayday: ${LOG_LEVEL:INFO}
