server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: drmayday-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/drmayday}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:${DB_USERNAME:postgres}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-please-use-env-var}
  access-token-expiration-ms: ${JWT_ACCESS_EXP:3600000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXP:604800000}

logging:
  level:
    com.drmayday: ${LOG_LEVEL:INFO}
