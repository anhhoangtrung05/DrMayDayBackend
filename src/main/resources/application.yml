server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: drmayday-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5433/drmayday}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:${DB_USERNAME:postgres}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        "[format_sql]": true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:change-this-secret-in-production-please-use-env-var}
  access-token-expiration-ms: ${JWT_ACCESS_EXP:3600000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXP:604800000}

authentication:
  password-reset-token-expiration-minutes: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:5}

speedsms:
  api-url: ${SPEEDSMS_API_URL:https://api.speedsms.vn/index.php/sms/send}
  api-token: ${SPEEDSMS_API_TOKEN:}
  sms-type: ${SPEEDSMS_SMS_TYPE:4}
  sender: ${SPEEDSMS_SENDER:}
  password-reset-message: ${SPEEDSMS_PASSWORD_RESET_MESSAGE:Ma xac thuc DrMayDay cua ban la %s. Ma co hieu luc trong %d phut.}

logging:
  level:
    "[com.example.drmayday]": ${LOG_LEVEL:INFO}
